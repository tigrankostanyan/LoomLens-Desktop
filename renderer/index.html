<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoomLens - Electron Renderer Studio</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="./style.css">
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      height: 56px;
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
    }
    .badge-tag {
      font-size: 10px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .main-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .canvas-viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    #stageCanvas {
      max-width: 100%;
      max-height: 100%;
      background: #000;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      cursor: crosshair;
    }
    .sidebar {
      width: 380px;
      background: var(--card);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger {
      background: #ef4444;
      color: #fff;
    }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
      color: #e2e8f0;
    }
    .btn-outline:hover { background: rgba(255,255,255,0.1); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .segmented-btn {
      padding: 8px;
      font-size: 12px;
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .segmented-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      font-weight: 600;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
    }
    input[type="range"] {
      flex: 1;
      margin-left: 12px;
      accent-color: #3b82f6;
    }
    /* Hidden media elements for canvas pipeline */
    video.pipeline-source {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Hidden video elements feeding the HTML5 Canvas compositor -->
  <video id="screenVideo" class="pipeline-source" playsinline autoplay muted></video>
  <video id="cameraVideo" class="pipeline-source" playsinline autoplay muted></video>

  <!-- Top bar -->
  <header>
    <div class="logo-container">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #f59e0b, #ef4444); display: flex; align-items: center; justify-content: center; font-size: 14px;">📹</div>
      <span>LoomLens Desktop</span>
      <span class="badge-tag">60 FPS COMPOSITOR</span>
    </div>

    <!-- Live Recording Status Indicator -->
    <div id="recordingIndicator" style="display: none; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 9999px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5);">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: pulse 1s infinite;"></span>
      <span id="recTimerText" style="font-size: 13px; font-weight: 700; color: #fca5a5;">00:00</span>
    </div>

    <!-- Quick Actions -->
    <div style="display: flex; gap: 10px;">
      <button id="toggleRecordBtn" class="btn btn-primary">
        <span>⏺</span> Start Recording
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="main-workspace">
    <!-- Center Preview Canvas (1080p target) -->
    <div class="canvas-viewport">
      <canvas id="stageCanvas" width="1920" height="1080"></canvas>
    </div>

    <!-- Right Controls Sidebar -->
    <aside class="sidebar">
      <!-- 1. Screen Capture Layer -->
      <div class="sidebar-section">
        <div class="section-title">
          <span>1. Desktop Screen Source</span>
          <span id="screenStatusBadge" style="color: #94a3b8; font-weight: 500;">Idle</span>
        </div>
        <button id="selectScreenBtn" class="btn btn-outline" style="width: 100%;">
          🖥️ Select Screen / Window
        </button>
      </div>

      <!-- 2. Remote Phone Camera / Local Cam Layer -->
      <div class="sidebar-section">
        <div class="section-title">
          <span>2. Camera Source</span>
          <span id="camStatusBadge" style="color: #f59e0b; font-weight: 500;">Disconnected</span>
        </div>
        
        <div class="grid-2" style="margin-bottom: 12px;">
          <button id="usePhoneCamBtn" class="segmented-btn active">📱 Remote Phone</button>
          <button id="useLocalCamBtn" class="segmented-btn">💻 Local Webcam</button>
        </div>

        <div id="phoneCamDetails" style="background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 8px; font-size: 12px; margin-bottom: 10px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
            <span style="color: #94a3b8;">Local IP Link:</span>
            <span id="phoneLinkText" style="color: #38bdf8; font-family: monospace;">/cam</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: #94a3b8;">Stream Status:</span>
            <span id="phoneWebRTCStatus" style="color: #e2e8f0;">Waiting for phone...</span>
          </div>
        </div>
      </div>

      <!-- 3. Mask Shapes & Framing (User Request) -->
      <div class="sidebar-section">
        <div class="section-title">
          <span>3. Camera Mask Shape</span>
        </div>
        
        <div class="grid-4" style="margin-bottom: 12px;">
          <button class="segmented-btn shape-btn active" data-shape="squircle">Squircle</button>
          <button class="segmented-btn shape-btn" data-shape="circle">Circle</button>
          <button class="segmented-btn shape-btn" data-shape="rect">Rounded</button>
          <button class="segmented-btn shape-btn" data-shape="portrait">9:16</button>
        </div>

        <div class="section-title" style="margin-top: 16px;">
          <span>Custom Frame / Border Glow</span>
        </div>
        <div class="grid-4" style="margin-bottom: 12px;">
          <button class="segmented-btn frame-btn active" data-frame="amber">Gold Halo</button>
          <button class="segmented-btn frame-btn" data-frame="neon">Cyan Neon</button>
          <button class="segmented-btn frame-btn" data-frame="purple">Violet</button>
          <button class="segmented-btn frame-btn" data-frame="none">Minimal</button>
        </div>
      </div>

      <!-- 4. Position & Geometry -->
      <div class="sidebar-section">
        <div class="section-title">
          <span>4. Position & Corner Snapping</span>
        </div>
        
        <div class="grid-4" style="margin-bottom: 14px;">
          <button class="segmented-btn pos-btn active" data-pos="top-right">Top R</button>
          <button class="segmented-btn pos-btn" data-pos="top-left">Top L</button>
          <button class="segmented-btn pos-btn" data-pos="bottom-right">Bot R</button>
          <button class="segmented-btn pos-btn" data-pos="bottom-left">Bot L</button>
        </div>

        <div class="control-row">
          <span>Camera Size</span>
          <input type="range" id="camSizeSlider" min="200" max="600" value="380">
        </div>
        <div class="control-row">
          <span>Corner Radius</span>
          <input type="range" id="camRadiusSlider" min="0" max="80" value="44">
        </div>
        <div class="control-row">
          <span>Flip / Mirror</span>
          <input type="checkbox" id="camFlipToggle" checked>
        </div>
      </div>

      <!-- 5. Audio & Mic -->
      <div class="sidebar-section">
        <div class="section-title">
          <span>5. Audio Input & Meter</span>
        </div>
        <div style="height: 12px; background: #0f172a; border-radius: 6px; overflow: hidden; border: 1px solid #1e293b;">
          <div id="audioMeterBar" style="height: 100%; width: 0%; background: linear-gradient(to right, #10b981, #f59e0b, #ef4444); transition: width 0.05s ease;"></div>
        </div>
      </div>
    </aside>
  </div>

  <script src="./app.js"></script>
</body>
</html>
